# This is a Declarative Automation Bundle definition for End_to_end_DAB.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: End_to_end_DAB
  uuid: 8575e602-689d-47eb-85ec-ada152d33550

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: http://127.0.0.1:7073
    variables:
      catalog: uat
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/mukesh.dhiman@capgemini.com to make sure we only have a single copy.
      root_path: /Workspace/Users/mukesh.dhiman@capgemini.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: uat
      schema: prod
    permissions:
      - user_name: mukesh.dhiman@capgemini.com
        level: CAN_MANAGE
