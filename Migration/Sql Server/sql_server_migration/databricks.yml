# This is a Declarative Automation Bundle definition for my_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: my_project
  uuid: 1ad25480-824e-4d04-b6bb-27e42f81336a

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: http://127.0.0.1:7073
    variables:
      catalog: dbacademy
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/labuser17339607_1793437270@vocareum.com to make sure we only have a single copy.
      root_path: /Workspace/Users/labuser17339607_1793437270@vocareum.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbacademy
      schema: prod
    permissions:
      - user_name: labuser17339607_1793437270@vocareum.com
        level: CAN_MANAGE
