# This is a Declarative Automation Bundle definition for india_project_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: india_project_bundle
  uuid: e409e951-3ff4-416a-8576-a4d853450f63

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  sp_application_id:
    description: >-
      Application (client) ID of the CI/CD service principal (service_connection1).
      Passed in by the Azure DevOps pipeline via --var; only used by the prod target.
    default: ""

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405615726115651.11.azuredatabricks.net
    variables:
      catalog: dev
      schema: dev
  # prod:
  #   mode: production
  #   workspace:
  #     host: https://adb-7405615726115651.11.azuredatabricks.net
  #     # Deploy into the deploying identity's own home folder. When the CI/CD service principal
  #     # deploys, this resolves to /Workspace/Users/<sp-application-id>/..., so it owns the single prod copy.
  #     root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}
